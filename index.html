<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz/Flashcard</title>
<style>
  :root{
    --bg:#F6F4FB;
    --surface:#FFFFFF;
    --border:#E4DEF5;
    --text:#211A33;
    --text-dim:#79708F;
    --accent:#7C3AED;
    --accent-dim:#EDE4FD;
    --accent-2:#A855F7;
    --green:#16A34A;
    --red:#DC2626;
    --radius:12px;
    --shadow: 0 1px 2px rgba(88,28,135,.06), 0 6px 18px rgba(88,28,135,.07);
    --shadow-lg: 0 10px 30px rgba(124,58,237,.18);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background:
      radial-gradient(720px 420px at 15% -8%, rgba(168,85,247,.14), transparent 60%),
      radial-gradient(640px 380px at 100% 0%, rgba(124,58,237,.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    min-height:100vh;
  }

  body{
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
  }

  #app{
    width:100%;
    max-width: 640px;
  }

  a, button, input, textarea{ font-family:inherit; }

  button{
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible, .flashcard:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .hidden{ display:none !important; }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 24px;
  }

  header h1{
    font-size: 21px;
    font-weight: 800;
    margin:0;
    background: linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.01em;
  }

  .back-btn{
    font-size: 14px;
    font-weight:600;
    color: var(--accent);
    padding: 6px 10px;
    border-radius: 8px;
    transition: background .15s ease, transform .15s ease;
  }
  .back-btn:hover{ background: var(--accent-dim); }
  .back-btn:active{ transform: scale(.96); }

  /* ---------- Cards / panels ---------- */
  .panel{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    animation: panel-in .35s ease both;
  }

  @keyframes panel-in{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .panel h2{
    font-size: 16px;
    margin: 0 0 14px;
  }

  /* ---------- Add form ---------- */
  .field{ margin-bottom: 12px; }
  .field label{
    display:block;
    font-size: 13px;
    font-weight:600;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field textarea{
    width:100%;
    resize: vertical;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14.5px;
    color: var(--text);
    background: var(--bg);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    outline: none;
  }

  .btn{
    font-size: 14.5px;
    font-weight:600;
    padding: 10px 18px;
    border-radius: 8px;
    transition: transform .12s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn-primary{
    background: linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 100%);
    color:#fff;
    box-shadow: 0 4px 14px rgba(124,58,237,.28);
  }
  .btn-primary:hover:not(:disabled){ filter: brightness(1.06); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .btn-primary:active:not(:disabled){ transform: translateY(0); }
  .btn-primary:disabled{ opacity:.4; cursor:default; box-shadow:none; }
  .btn-secondary{ background: var(--bg); border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover{ border-color: var(--accent); color: var(--accent); }
  .btn-secondary:active{ transform: translateY(0); }
  .btn-danger{ background:none; color: var(--red); font-size:13px; font-weight:600; }
  .btn-danger:hover{ text-decoration: underline; }
  .btn-block{ width:100%; }

  /* ---------- Card list ---------- */
  .card-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 12px;
    padding: 12px 10px;
    margin: 0 -10px;
    border-bottom: 1px solid var(--border);
    border-radius: 8px;
    transition: background .15s ease;
  }
  .card-row:hover{ background: var(--accent-dim); }
  .card-row:last-child{ border-bottom:none; }

  .card-row-text{ flex:1; min-width:0; }
  .card-row-text .front{ font-size: 14.5px; font-weight:600; margin-bottom: 2px; }
  .card-row-text .back{ font-size: 13.5px; color: var(--text-dim); }

  .card-row-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-link{ font-size:13px; font-weight:600; color: var(--text-dim); }
  .icon-link:hover{ color: var(--accent); }

  .empty-state{
    text-align:center;
    padding: 28px 10px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .count-pill{
    display:inline-block;
    font-size: 12.5px;
    font-weight:700;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .study-actions{ display:flex; gap:10px; }
  .study-actions .btn{ flex:1; text-align:center; }

  /* ---------- Progress ---------- */
  .progress-track{
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    overflow:hidden;
    margin-bottom: 20px;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    border-radius: 999px;
    transition: width .25s ease;
    width:0%;
  }

  .step-label{
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* ---------- Quiz ---------- */
  .question{
    font-size: 19px;
    font-weight:700;
    line-height:1.4;
    margin: 0 0 20px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom: 16px;
  }

  .option{
    text-align:left;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 14.5px;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option:hover:not(:disabled){ border-color: var(--accent); background: var(--accent-dim); }
  .option:active:not(:disabled){ transform: scale(.99); }
  .option.correct{ border-color: var(--green); background: #EAF8EE; }
  .option.incorrect{ border-color: var(--red); background: #FCEBEB; }
  .option:disabled{ cursor:default; }

  .feedback{
    font-size: 14px;
    line-height:1.5;
    color: var(--text-dim);
    background: var(--accent-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }

  /* ---------- Results ---------- */
  .results h2{ font-size:22px; margin: 0 0 4px; }
  .score-big{
    font-size: 44px;
    font-weight:800;
    background: linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 6px 0 16px;
  }
  .results p{ color: var(--text-dim); margin-bottom: 22px; }
  .results-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---------- Flashcards ---------- */
  .card-stage{ perspective: 1400px; margin-bottom: 14px; }

  .flashcard{
    width:100%;
    min-height: 220px;
    display:block;
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    min-height:220px;
    transform-style: preserve-3d;
    transition: transform .45s ease;
  }
  .flashcard.flipped .card-inner{ transform: rotateY(180deg); }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition:none; }
  }

  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 28px;
    font-size: 17px;
    line-height:1.5;
    box-shadow: var(--shadow);
  }
  .card-front{ background: var(--surface); font-weight:600; }
  .card-back{
    background: linear-gradient(150deg, var(--accent-dim) 0%, #F3E9FE 100%);
    transform: rotateY(180deg);
  }

  .card-label{
    position:absolute;
    top:14px; left:16px;
    font-size: 11.5px;
    font-weight:700;
    letter-spacing:0.03em;
    color: var(--accent);
  }

  .flip-hint{
    text-align:center;
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 0 0 20px;
  }

  .flash-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
  }

  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    transition: border-color .15s ease, background .15s ease, color .15s ease, transform .12s ease;
  }
  .icon-btn:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .icon-btn:active{ transform: scale(.94); }

  .shuffle-btn{
    font-size: 13.5px;
    font-weight:600;
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 999px;
    color: var(--text-dim);
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .shuffle-btn:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* ---------- Import from image ---------- */
  .file-drop{
    display:flex;
    align-items:center;
    gap:10px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--bg);
    margin-bottom: 12px;
  }
  .file-drop input[type="file"]{
    flex:1;
    min-width:0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .file-drop input[type="file"]::file-selector-button{
    font-family: inherit;
    font-size: 13px;
    font-weight:600;
    padding: 7px 12px;
    margin-right: 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor:pointer;
  }
  .import-status{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
    line-height:1.5;
    min-height: 18px;
  }
  .import-status.error{ color: var(--red); }
  .import-status.success{ color: var(--green); }

  .spinner{
    display:inline-block;
    width:13px; height:13px;
    border-radius:50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- Confetti ---------- */
  #confetti-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
  }
  .confetti-piece{
    position: absolute;
    top: -12px;
    border-radius: 2px;
    animation-name: confetti-fall;
    animation-timing-function: cubic-bezier(.25,.46,.45,.94);
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(105vh) rotate(var(--rot, 540deg)); opacity: .9; }
  }
</style>
</head>
<body>

<div id="app">

  <header>
    <h1>Quiz/Flashcard</h1>
    <button class="back-btn hidden" id="global-back">Back</button>
  </header>

  <!-- MANAGE / HOME -->
  <section id="screen-manage">

    <div class="panel">
      <h2>Import from image</h2>
      <div class="file-drop">
        <input type="file" id="input-images" accept="image/*" multiple>
      </div>
      <button class="btn btn-primary btn-block" id="import-images-btn">Generate cards from image(s)</button>
      <div class="import-status" id="import-status"></div>
    </div>

    <div class="panel">
      <h2>Add a card</h2>
      <div class="field">
        <label for="input-front">Question / front</label>
        <textarea id="input-front" placeholder="e.g. What is the capital of Japan?"></textarea>
      </div>
      <div class="field">
        <label for="input-back">Answer / back</label>
        <textarea id="input-back" placeholder="e.g. Tokyo"></textarea>
      </div>
      <button class="btn btn-primary" id="add-card-btn">Add card</button>
    </div>

    <div class="panel">
      <span class="count-pill" id="card-count-pill">0 cards</span>
      <div id="card-list"></div>
      <div class="empty-state hidden" id="empty-state">No cards yet — add your first one above.</div>
    </div>

    <div class="panel">
      <h2>Study</h2>
      <div class="study-actions">
        <button class="btn btn-secondary" id="start-flash-btn">Flashcards</button>
        <button class="btn btn-primary" id="start-quiz-btn">Quiz</button>
      </div>
    </div>

  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="hidden">
    <div class="panel">
      <div class="step-label" id="quiz-step-label">Question 1 of 1</div>
      <div class="progress-track"><div class="progress-fill" id="quiz-progress"></div></div>
      <h2 class="question" id="quiz-question"></h2>
      <div class="options" id="quiz-options"></div>
      <div class="feedback hidden" id="quiz-feedback"></div>
      <button class="btn btn-primary btn-block" id="quiz-next" disabled>Next question</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="hidden">
    <div class="panel results">
      <h2>Quiz complete</h2>
      <div class="score-big" id="score-text">0/0</div>
      <p id="score-msg"></p>
      <div class="results-actions">
        <button class="btn btn-primary" id="quiz-retry">Try again</button>
        <button class="btn btn-secondary" id="results-home">Back to cards</button>
      </div>
    </div>
  </section>

  <!-- FLASHCARDS -->
  <section id="screen-flash" class="hidden">
    <div class="panel">
      <div class="step-label" id="flash-step-label">Card 1 of 1</div>
      <div class="progress-track"><div class="progress-fill" id="flash-progress"></div></div>

      <div class="card-stage">
        <button class="flashcard" id="flashcard">
          <div class="card-inner">
            <div class="card-face card-front">
              <span class="card-label">QUESTION</span>
              <span id="card-front-text"></span>
            </div>
            <div class="card-face card-back">
              <span class="card-label">ANSWER</span>
              <span id="card-back-text"></span>
            </div>
          </div>
        </button>
      </div>
      <p class="flip-hint">Click the card to flip it</p>

      <div class="flash-controls">
        <button class="icon-btn" id="flash-prev" aria-label="Previous card">&#8592;</button>
        <button class="shuffle-btn" id="flash-shuffle">Shuffle</button>
        <button class="icon-btn" id="flash-next" aria-label="Next card">&#8594;</button>
      </div>
    </div>
  </section>

</div>

<div id="confetti-layer"></div>

<script>
(function(){

  const STORAGE_KEY = 'quizFlashcardApp.cards';

  const defaultCards = [
    { id: cryptoId(), front: 'What is the capital of Japan?', back: 'Tokyo' },
    { id: cryptoId(), front: 'What is the largest planet in the solar system?', back: 'Jupiter' },
    { id: cryptoId(), front: 'Who wrote "Romeo and Juliet"?', back: 'William Shakespeare' },
    { id: cryptoId(), front: 'What is the chemical symbol for gold?', back: 'Au' }
  ];

  function cryptoId(){
    return 'c_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  /* ---------------- STORAGE ---------------- */

  function loadCards(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) return parsed;
      }
    }catch(e){}
    return defaultCards.slice();
  }

  function saveCards(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }catch(e){}
  }

  let cards = loadCards();

  /* ---------------- NAV ---------------- */

  function show(id){
    ['screen-manage','screen-quiz','screen-results','screen-flash'].forEach(s=>{
      document.getElementById(s).classList.toggle('hidden', s!==id);
    });
    document.getElementById('global-back').classList.toggle('hidden', id==='screen-manage');
  }

  document.getElementById('global-back').addEventListener('click', ()=>{
    show('screen-manage');
    renderCardList();
  });

  /* ---------------- MANAGE SCREEN ---------------- */

  function renderCardList(){
    const list = document.getElementById('card-list');
    const empty = document.getElementById('empty-state');
    const pill = document.getElementById('card-count-pill');

    pill.textContent = cards.length + (cards.length === 1 ? ' card' : ' cards');
    list.innerHTML = '';

    if(cards.length === 0){
      empty.classList.remove('hidden');
    } else {
      empty.classList.add('hidden');
      cards.forEach(card=>{
        const row = document.createElement('div');
        row.className = 'card-row';
        row.innerHTML = `
          <div class="card-row-text">
            <div class="front"></div>
            <div class="back"></div>
          </div>
          <div class="card-row-actions">
            <button class="icon-link" data-action="delete">Delete</button>
          </div>
        `;
        row.querySelector('.front').textContent = card.front;
        row.querySelector('.back').textContent = card.back;
        row.querySelector('[data-action="delete"]').addEventListener('click', ()=>{
          cards = cards.filter(c => c.id !== card.id);
          saveCards();
          renderCardList();
        });
        list.appendChild(row);
      });
    }

    const hasEnough = cards.length >= 1;
    document.getElementById('start-flash-btn').disabled = !hasEnough;
    document.getElementById('start-quiz-btn').disabled = !hasEnough;
  }

  document.getElementById('add-card-btn').addEventListener('click', ()=>{
    const frontEl = document.getElementById('input-front');
    const backEl = document.getElementById('input-back');
    const front = frontEl.value.trim();
    const back = backEl.value.trim();
    if(!front || !back) return;
    cards.push({ id: cryptoId(), front, back });
    saveCards();
    frontEl.value = '';
    backEl.value = '';
    frontEl.focus();
    renderCardList();
  });

  /* ---------------- IMPORT FROM IMAGE ---------------- */

  const importBtn = document.getElementById('import-images-btn');
  const importInput = document.getElementById('input-images');
  const importStatus = document.getElementById('import-status');

  function setImportStatus(html, kind){
    importStatus.className = 'import-status' + (kind ? ' ' + kind : '');
    importStatus.innerHTML = html;
  }

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = () => reject(new Error('Could not read ' + file.name));
      reader.readAsDataURL(file);
    });
  }

  function extractJsonArray(text){
    // Strip markdown code fences if present, then find the first [...] block.
    let cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
    const start = cleaned.indexOf('[');
    const end = cleaned.lastIndexOf(']');
    if(start === -1 || end === -1 || end < start){
      throw new Error('No JSON array found in response');
    }
    return JSON.parse(cleaned.slice(start, end+1));
  }

  importBtn.addEventListener('click', async ()=>{
    const files = Array.from(importInput.files || []);
    if(files.length === 0){
      setImportStatus('Choose one or more images first.', 'error');
      return;
    }

    importBtn.disabled = true;
    setImportStatus('<span class="spinner"></span>Reading image(s)...');

    try{
      const imageBlocks = [];
      for(const file of files){
        if(!file.type.startsWith('image/')){
          continue;
        }
        const data = await fileToBase64(file);
        imageBlocks.push({
          type: 'image',
          source: { type: 'base64', media_type: file.type || 'image/png', data }
        });
      }

      if(imageBlocks.length === 0){
        setImportStatus('No valid image files found.', 'error');
        importBtn.disabled = false;
        return;
      }

      setImportStatus('<span class="spinner"></span>Reading text and generating cards...');

      const prompt = `You are given one or more images (notes, textbook pages, slides, screenshots, etc). Read all text/content visible in them and turn it into study flashcards.

Rules:
- Respond with ONLY a JSON array, no markdown fences, no commentary before or after.
- Each item must be an object with exactly two string fields: "front" (a question or prompt) and "back" (the answer).
- If the image already contains explicit questions and answers, use those directly.
- Otherwise, generate sensible question/answer pairs from the key facts, terms, and definitions shown.
- Keep each front and back concise (well under a sentence or two).
- Produce as many distinct, non-redundant cards as the content reasonably supports, but keep the total response compact.
- If an image contains no usable text content, simply omit cards for it.

Example output format:
[{"front":"What is the capital of Japan?","back":"Tokyo"}]`;

      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBlocks, prompt })
      });

      if(!response.ok){
        const errBody = await response.json().catch(()=>({}));
        throw new Error(errBody.error || ('API request failed (' + response.status + ')'));
      }

      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if(!textBlock || !textBlock.text){
        throw new Error('No text returned from the model');
      }

      const parsed = extractJsonArray(textBlock.text);
      const newCards = parsed
        .filter(c => c && typeof c.front === 'string' && typeof c.back === 'string' && c.front.trim() && c.back.trim())
        .map(c => ({ id: cryptoId(), front: c.front.trim(), back: c.back.trim() }));

      if(newCards.length === 0){
        setImportStatus('Could not find any usable text in the image(s). Try a clearer photo.', 'error');
        importBtn.disabled = false;
        return;
      }

      cards.push(...newCards);
      saveCards();
      renderCardList();
      importInput.value = '';
      setImportStatus(`Added ${newCards.length} card${newCards.length === 1 ? '' : 's'} from your image(s).`, 'success');

    }catch(err){
      console.error('Import from image error:', err);
      setImportStatus('Something went wrong reading that image: ' + err.message, 'error');
    }finally{
      importBtn.disabled = false;
    }
  });

  /* ---------------- FLASHCARD MODE ---------------- */

  let flashOrder = [];
  let flashPos = 0;

  function startFlash(){
    if(cards.length === 0) return;
    flashOrder = cards.map((_,i)=>i);
    flashPos = 0;
    show('screen-flash');
    renderFlashcard();
  }

  function renderFlashcard(){
    const card = document.getElementById('flashcard');
    card.classList.remove('flipped');
    const item = cards[flashOrder[flashPos]];
    document.getElementById('card-front-text').textContent = item.front;
    document.getElementById('card-back-text').textContent = item.back;
    document.getElementById('flash-step-label').textContent = `Card ${flashPos+1} of ${cards.length}`;
    const pct = cards.length > 1 ? (flashPos/(cards.length-1))*100 : 100;
    document.getElementById('flash-progress').style.width = pct + '%';
  }

  document.getElementById('flashcard').addEventListener('click', function(){
    this.classList.toggle('flipped');
  });

  document.getElementById('flash-next').addEventListener('click', ()=>{
    flashPos = (flashPos+1) % flashOrder.length;
    renderFlashcard();
  });
  document.getElementById('flash-prev').addEventListener('click', ()=>{
    flashPos = (flashPos-1+flashOrder.length) % flashOrder.length;
    renderFlashcard();
  });
  document.getElementById('flash-shuffle').addEventListener('click', ()=>{
    flashOrder = shuffle(flashOrder);
    flashPos = 0;
    renderFlashcard();
  });

  document.getElementById('start-flash-btn').addEventListener('click', startFlash);

  /* ---------------- QUIZ MODE ---------------- */

  let quizOrder = [];
  let quizPos = 0;
  let quizScore = 0;
  let quizAnswered = false;

  function startQuiz(){
    if(cards.length === 0) return;
    quizOrder = shuffle(cards.map((_,i)=>i));
    quizPos = 0;
    quizScore = 0;
    show('screen-quiz');
    renderQuizQuestion();
  }

  function buildOptionsFor(correctCard){
    // gather up to 3 distractor answers from other cards
    const others = cards.filter(c => c.id !== correctCard.id).map(c => c.back);
    const distractors = shuffle(others).slice(0, 3);
    const optionTexts = shuffle([correctCard.back, ...distractors]);
    return optionTexts;
  }

  function renderQuizQuestion(){
    quizAnswered = false;
    const item = cards[quizOrder[quizPos]];
    document.getElementById('quiz-step-label').textContent = `Question ${quizPos+1} of ${quizOrder.length}`;
    document.getElementById('quiz-progress').style.width = (quizPos/quizOrder.length*100)+'%';
    document.getElementById('quiz-question').textContent = item.front;

    const optWrap = document.getElementById('quiz-options');
    optWrap.innerHTML = '';

    const optionTexts = buildOptionsFor(item);

    optionTexts.forEach(text=>{
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = text;
      if(text === item.back) btn.dataset.correct = 'true';
      btn.addEventListener('click', ()=> selectAnswer(btn, text === item.back));
      optWrap.appendChild(btn);
    });

    document.getElementById('quiz-feedback').classList.add('hidden');
    document.getElementById('quiz-next').disabled = true;
  }

  function selectAnswer(btn, isCorrect){
    if(quizAnswered) return;
    quizAnswered = true;
    if(isCorrect) quizScore++;

    const allOptions = document.querySelectorAll('#quiz-options .option');
    allOptions.forEach(o=>{ o.disabled = true; });
    btn.classList.add(isCorrect ? 'correct' : 'incorrect');

    if(!isCorrect){
      const correctBtn = Array.from(allOptions).find(o => o.dataset.correct === 'true');
      if(correctBtn) correctBtn.classList.add('correct');
    }

    const feedback = document.getElementById('quiz-feedback');
    feedback.textContent = isCorrect ? 'Correct.' : 'Not quite — the highlighted option was correct.';
    feedback.classList.remove('hidden');

    document.getElementById('quiz-next').disabled = false;
  }

  document.getElementById('quiz-next').addEventListener('click', ()=>{
    quizPos++;
    if(quizPos >= quizOrder.length){
      finishQuiz();
    } else {
      renderQuizQuestion();
    }
  });

  function finishQuiz(){
    document.getElementById('quiz-progress').style.width = '100%';
    show('screen-results');
    const total = quizOrder.length;
    document.getElementById('score-text').textContent = `${quizScore}/${total}`;
    let msg;
    const pct = quizScore/total;
    if(pct === 1){
      msg = 'Perfect score.';
      fireConfetti();
    }
    else if(pct >= 0.75) msg = 'Nice work — a strong result.';
    else if(pct >= 0.5) msg = 'Halfway there. A bit more review should help.';
    else msg = 'Worth another pass through the cards.';
    document.getElementById('score-msg').textContent = msg;
  }

  document.getElementById('quiz-retry').addEventListener('click', startQuiz);
  document.getElementById('results-home').addEventListener('click', ()=>{
    show('screen-manage');
    renderCardList();
  });
  document.getElementById('start-quiz-btn').addEventListener('click', startQuiz);

  /* ---------------- HELPERS ---------------- */

  function fireConfetti(){
    const layer = document.getElementById('confetti-layer');
    const colors = ['#7C3AED', '#A855F7', '#C084FC', '#F0ABFC', '#E9D5FF'];
    const count = 60;
    for(let i=0; i<count; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random()*6;
      piece.style.width = size + 'px';
      piece.style.height = (size * (0.5 + Math.random()*0.8)) + 'px';
      piece.style.left = (Math.random()*100) + 'vw';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
      const duration = 2.2 + Math.random()*1.4;
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = (Math.random()*0.3) + 's';
      layer.appendChild(piece);
      setTimeout(()=> piece.remove(), (duration+0.3)*1000);
    }
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  document.addEventListener('keydown', (e)=>{
    const flashVisible = !document.getElementById('screen-flash').classList.contains('hidden');
    if(!flashVisible) return;
    if(e.key === 'ArrowRight') document.getElementById('flash-next').click();
    if(e.key === 'ArrowLeft') document.getElementById('flash-prev').click();
    if(e.key === ' '){ e.preventDefault(); document.getElementById('flashcard').click(); }
  });

  /* ---------------- INIT ---------------- */

  saveCards();
  renderCardList();
  show('screen-manage');

})();
</script>

</body>
